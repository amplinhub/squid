<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#061a26">
<title>GROW UP</title>
<style>html, body { background: #03121c; }</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="game"></canvas>
<canvas id="overlay"></canvas>

<!-- loading screen (shown only if the logo has finished before everything is ready) -->
<div id="loading" class="screen" hidden>
  <div class="load-box">
    <div class="load-bar"><div id="load-fill"></div></div>
    <div id="load-text" data-i18n="loading">Загрузка…</div>
  </div>
</div>

<!-- main menu above the water -->
<div id="title-menu" class="title-layer" hidden>
  <div class="title-col">
    <img id="title-logo" src="assets/ui/growup.png" alt="GROW UP">
    <button class="tbtn-menu" data-i18n="menu_dive">Погружение</button>
    <button class="tbtn-menu" data-i18n="menu_settings">Настройки</button>
  </div>
</div>

<!-- creature select -->
<div id="select" class="title-layer" hidden>
  <button id="sel-back" class="icon-btn sel-back" aria-label="back">‹</button>
  <div class="sel-head"><div id="sel-name"></div><div id="sel-sub"></div></div>
  <button id="sel-left" class="sel-arrow left" aria-label="previous"></button>
  <button id="sel-right" class="sel-arrow right" aria-label="next"></button>
  <div id="sel-lock" hidden><img src="assets/ui/lock.png" alt=""><div id="sel-locktxt"></div></div>
  <div class="sel-card panel">
    <div id="sel-desc"></div>
    <div id="sel-abil"></div>
    <div id="sel-ctrl"></div>
    <button id="sel-go" class="menu-btn"></button>
  </div>
</div>
<div id="splash"></div>

<div id="hurt"></div>
<div id="hud" hidden>
  <!-- framed panel: size class, length, health, stamina bubbles, hunger, ability -->
  <div id="panel">
    <div class="h-title"><span id="h-stage"></span><span id="h-len"></span></div>
    <div class="h-row"><i class="ico ico-heart"></i><div class="hbar"><div id="h-hp" class="hfill hp"></div><span id="h-hpn"></span></div></div>
    <div class="h-row"><i class="ico ico-bub"></i><div id="h-st" class="bubbles"></div></div>
    <div class="h-row"><i class="ico-fish"></i><div id="h-foodbar" class="hbar"><div id="h-food" class="hfill food"></div><span class="hlabel" data-i18n="hunger">голод</span></div></div>
    <div id="h-abil" class="h-row" hidden><i class="ico-abil"></i><div class="hbar"><div id="h-ink" class="hfill ink"></div><span id="h-abiltxt" class="hlabel"></span><i class="mark m1"></i><i class="mark m2"></i></div></div>
  </div>
  <!-- depth gauge -->
  <div id="depth"><img src="assets/ui/dial.png" alt=""><div id="needle"></div><div id="depth-lbl"></div></div>
  <!-- missions -->
  <div id="missions"><div id="ms-head"></div><div id="ms-list"></div><div id="ms-note"></div></div>
  <!-- sonar -->
  <div id="sonar"><canvas id="sonar-c"></canvas><img src="assets/ui/porthole.png" alt=""><div id="sonar-lbl"></div></div>
  <div id="danger" hidden><div id="danger-1" data-i18n="danger">ОПАСНОСТЬ!</div><div id="danger-2"></div><div id="danger-3"></div></div>
  <div id="hide-note"></div>
  <div id="debug" hidden></div>
  <div id="hint" class="hint" data-i18n="hint_keys"></div>
</div>
<div id="msgs"></div>
<div class="top-right">
  <button id="btn-lang" class="icon-btn" aria-label="language">RU</button>
  <button id="btn-pause" class="icon-btn" aria-label="pause" hidden>II</button>
</div>

<!-- touch controls: shown only on touch devices while playing -->
<div id="touch" hidden>
  <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
  <div id="touch-buttons">
    <button id="btn-ability" class="tbtn small" data-i18n="btn_ability">Способность</button>
    <button id="btn-boost" class="tbtn" data-i18n="btn_boost">Рывок</button>
    <button id="btn-swim" class="tbtn big" data-i18n="btn_swim">Плыть</button>
  </div>
</div>

<!-- death -->
<div id="dead" class="screen dim" hidden>
  <div class="panel menu">
    <h1 data-i18n="dead_title">Кальмар погиб</h1>
    <div id="dead-cause" class="dead-cause"></div>
    <div id="dead-stats" class="dead-stats"></div>
    <button id="btn-again" class="menu-btn" data-i18n="again">Ещё раз</button>
  </div>
</div>

<!-- pause -->
<div id="pause" class="screen dim" hidden>
  <div class="panel menu">
    <h1 data-i18n="paused">Пауза</h1>
    <button id="btn-resume" class="menu-btn" data-i18n="resume">Продолжить</button>
    <button id="btn-bestiary" class="menu-btn" data-i18n="bestiary">Бестиарий</button>
    <button id="btn-settings" class="menu-btn" data-i18n="menu_settings">Настройки</button>
    <button id="btn-mainmenu" class="menu-btn" data-i18n="main_menu">Главное меню</button>
    <div class="menu-tip" data-i18n="pause_tip"></div>
  </div>
</div>

<!-- settings -->
<div id="settings" class="screen dim" hidden>
  <div class="panel menu wide">
    <h1 data-i18n="menu_settings">Настройки</h1>
    <div class="set-row"><span data-i18n="gfx">Графика</span>
      <select id="sel-quality">
        <option value="auto" data-i18n="q_auto">Авто</option>
        <option value="0" data-i18n="q_low">Низкое</option>
        <option value="1" data-i18n="q_mid">Среднее</option>
        <option value="2" data-i18n="q_high">Высокое</option>
      </select></div>
    <div class="set-note" id="gfx-note"></div>
    <div class="set-row"><span data-i18n="vol_sfx">Звуки</span><input id="vol-sfx" type="range" min="0" max="1" step="0.1"></div>
    <div class="set-row"><span data-i18n="vol_amb">Шум моря</span><input id="vol-amb" type="range" min="0" max="1" step="0.1"></div>
    <div class="set-row"><span data-i18n="vol_music">Музыка</span><input id="vol-music" type="range" min="0" max="1" step="0.1"></div>
    <div class="set-row"><span data-i18n="fullscreen">Полный экран</span><input id="set-full" type="checkbox"></div>
    <div class="set-row"><span data-i18n="invert">Инверсия вертикали</span><input id="set-inv" type="checkbox"></div>
    <div class="set-note" id="inv-note"></div>
    <div class="set-row"><span data-i18n="language">Язык</span>
      <select id="sel-lang"><option value="ru">Русский</option><option value="en">English</option></select></div>
    <button id="btn-set-back" class="menu-btn" data-i18n="back">Назад</button>
  </div>
</div>

<!-- bestiary (under the transparent WebGL canvas: the models are drawn into the card windows) -->
<div id="bestiary" hidden>
  <div class="bst-head">
    <button id="bst-close" class="menu-btn small" data-i18n="back">Назад</button>
    <div><div id="bst-title"></div><div id="bst-sub"></div></div>
  </div>
  <div id="bst-grid"></div>
  <div id="bst-detail" hidden>
    <div class="panel bst-card">
      <div id="bst-win"><button id="bst-prev" class="bst-nav">‹</button><button id="bst-next" class="bst-nav">›</button><div class="bst-tip" data-i18n="bst_drag"></div></div>
      <div class="bst-text"><div id="bd-name"></div><div id="bd-lat"></div><div id="bd-facts"></div>
        <button id="bst-back" class="menu-btn small" data-i18n="back">Назад</button></div>
    </div>
  </div>
</div>

<!-- Boot: manifest.json (never cached) gives a content hash for every file; each file is loaded as
     "file?h=hash" through an import map, so an update reaches players at once and old and new files
     never mix. Without the manifest the game still starts, just without the stamps. -->
<script>
(function () {
  var THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
  function start(files) {
    var q = function (f) { return files[f] ? f + '?h=' + files[f] : f; };
    var map = { three: THREE_URL };
    for (var f in files) if (/\.js$/.test(f)) map['./' + f] = './' + q(f);
    var im = document.createElement('script');
    im.type = 'importmap';
    im.textContent = JSON.stringify({ imports: map });
    document.head.appendChild(im);
    var css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = q('css/main.css');
    css.onload = css.onerror = function () {
      var s = document.createElement('script');
      s.type = 'module'; s.src = './' + q('js/main.js');
      document.body.appendChild(s);
    };
    document.head.appendChild(css);
  }
  fetch('manifest.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : { files: {} }; })
    .then(function (m) { start(m.files || {}); }, function () { start({}); });
})();
</script>
</body>
</html>
